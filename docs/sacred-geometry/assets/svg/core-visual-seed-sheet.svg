<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">ArtisanalCanvas Sacred Geometry Core Visual Seed Sheet</title>
  <desc id="desc">A rights-safe original SVG seed sheet showing flat construction diagrams for cross-cultural geometry lessons: Islamic star grid, decagon star, Greek meander, Mesoamerican stepped fret, Persian fourfold garden, South Asian kolam dots, Chinese squared spiral, Renaissance perspective floor, Kuba broken grid, and lattice screen.</desc>
  <style>
    .panel { fill: #fbfaf7; stroke: #222; stroke-width: 2; }
    .grid { stroke: #bbb; stroke-width: 1; opacity: 0.8; }
    .thin { stroke: #333; stroke-width: 2; fill: none; }
    .heavy { stroke: #111; stroke-width: 5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .fill { fill: #e8e0d2; stroke: #111; stroke-width: 2; }
    .accent { fill: #d7c3a2; stroke: #111; stroke-width: 2; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #111; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333; }
    .dot { fill: #111; }
  </style>

  <rect x="0" y="0" width="1600" height="1200" fill="#f4f1ea"/>
  <text x="50" y="50" class="text" style="font-size:32px;font-weight:bold;">ArtisanalCanvas Sacred Geometry Core Visual Seed Sheet</text>
  <text x="50" y="80" class="small">Original SVG seed diagrams for clean 2D construction. Use raster or Canvas assets for material, shadow, texture, and historical references.</text>

  <!-- Panel 1: Islamic eight point star construction -->
  <g transform="translate(50,120)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Islamic 8-point star</text>
    <text x="18" y="48" class="small">circle + square + diagonals</text>
    <g transform="translate(140,126)">
      <circle r="72" class="thin"/>
      <line x1="-72" y1="0" x2="72" y2="0" class="grid"/>
      <line x1="0" y1="-72" x2="0" y2="72" class="grid"/>
      <line x1="-51" y1="-51" x2="51" y2="51" class="grid"/>
      <line x1="-51" y1="51" x2="51" y2="-51" class="grid"/>
      <polygon points="0,-72 22,-22 72,0 22,22 0,72 -22,22 -72,0 -22,-22" class="fill"/>
      <polygon points="51,-51 22,-22 51,51 22,22 -51,51 -22,22 -51,-51 -22,-22" class="accent" opacity="0.7"/>
    </g>
  </g>

  <!-- Panel 2: Decagon and ten point star -->
  <g transform="translate(360,120)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Decagon star family</text>
    <text x="18" y="48" class="small">5 and 10 point logic</text>
    <g transform="translate(140,126)">
      <circle r="72" class="thin"/>
      <polygon points="0,-72 42,-58 68,-22 68,22 42,58 0,72 -42,58 -68,22 -68,-22 -42,-58" class="grid" fill="none"/>
      <polygon points="0,-72 68,22 -42,58 42,-58 -68,-22 68,-22 -42,-58 42,58 -68,22 0,72" class="heavy"/>
    </g>
  </g>

  <!-- Panel 3: Greek meander -->
  <g transform="translate(670,120)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Greek meander</text>
    <text x="18" y="48" class="small">continuous right-angle path</text>
    <g transform="translate(35,85)">
      <path d="M0 0 H210 V40 H40 V80 H210 V120 H0 V80 H170 V40 H0 Z" class="heavy"/>
      <path d="M0 0 H210 V40 H40 V80 H210 V120 H0 V80 H170 V40 H0" class="thin" opacity="0.25"/>
    </g>
  </g>

  <!-- Panel 4: Mesoamerican stepped fret -->
  <g transform="translate(980,120)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Stepped fret</text>
    <text x="18" y="48" class="small">angular spiral on square modules</text>
    <g transform="translate(70,65)">
      <path d="M0 120 H140 V0 H20 V100 H120 V20 H40 V80 H100 V40 H60 V60 H80" class="heavy"/>
      <g opacity="0.35">
        <path d="M0 0 H140 M0 20 H140 M0 40 H140 M0 60 H140 M0 80 H140 M0 100 H140 M0 120 H140" class="grid"/>
        <path d="M0 0 V120 M20 0 V120 M40 0 V120 M60 0 V120 M80 0 V120 M100 0 V120 M120 0 V120 M140 0 V120" class="grid"/>
      </g>
    </g>
  </g>

  <!-- Panel 5: Persian chahar bagh -->
  <g transform="translate(1290,120)">
    <rect class="panel" width="260" height="220" rx="12"/>
    <text x="18" y="28" class="text">Chahar bagh</text>
    <text x="18" y="48" class="small">fourfold garden plan</text>
    <g transform="translate(55,70)">
      <rect x="0" y="0" width="150" height="120" class="thin"/>
      <line x1="75" y1="0" x2="75" y2="120" class="heavy"/>
      <line x1="0" y1="60" x2="150" y2="60" class="heavy"/>
      <circle cx="75" cy="60" r="22" class="accent"/>
      <rect x="12" y="12" width="45" height="35" class="fill" opacity="0.55"/>
      <rect x="93" y="12" width="45" height="35" class="fill" opacity="0.55"/>
      <rect x="12" y="73" width="45" height="35" class="fill" opacity="0.55"/>
      <rect x="93" y="73" width="45" height="35" class="fill" opacity="0.55"/>
    </g>
  </g>

  <!-- Panel 6: South Asian kolam dot grid -->
  <g transform="translate(50,380)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Kolam dot grid</text>
    <text x="18" y="48" class="small">looping line around points</text>
    <g transform="translate(65,75)">
      <g>
        <circle class="dot" cx="0" cy="0" r="4"/><circle class="dot" cx="40" cy="0" r="4"/><circle class="dot" cx="80" cy="0" r="4"/><circle class="dot" cx="120" cy="0" r="4"/>
        <circle class="dot" cx="0" cy="40" r="4"/><circle class="dot" cx="40" cy="40" r="4"/><circle class="dot" cx="80" cy="40" r="4"/><circle class="dot" cx="120" cy="40" r="4"/>
        <circle class="dot" cx="0" cy="80" r="4"/><circle class="dot" cx="40" cy="80" r="4"/><circle class="dot" cx="80" cy="80" r="4"/><circle class="dot" cx="120" cy="80" r="4"/>
      </g>
      <path d="M-20 20 C0 -20, 40 -20, 60 20 C80 60, 120 60, 140 20 M-20 60 C0 100, 40 100, 60 60 C80 20, 120 20, 140 60" class="heavy"/>
    </g>
  </g>

  <!-- Panel 7: Chinese leiwen -->
  <g transform="translate(360,380)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Chinese leiwen</text>
    <text x="18" y="48" class="small">squared thunder spiral</text>
    <g transform="translate(70,70)">
      <path d="M0 0 H140 V120 H20 V20 H120 V100 H40 V40 H100 V80 H60 V60 H80" class="heavy"/>
      <path d="M0 140 H140 M0 120 H140 M0 100 H140 M0 80 H140 M0 60 H140 M0 40 H140 M0 20 H140 M0 0 H140" class="grid" opacity="0.35"/>
      <path d="M0 0 V140 M20 0 V140 M40 0 V140 M60 0 V140 M80 0 V140 M100 0 V140 M120 0 V140 M140 0 V140" class="grid" opacity="0.35"/>
    </g>
  </g>

  <!-- Panel 8: Renaissance one point floor -->
  <g transform="translate(670,380)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Renaissance floor</text>
    <text x="18" y="48" class="small">horizon and vanishing point</text>
    <g transform="translate(25,65)">
      <line x1="0" y1="40" x2="230" y2="40" class="thin"/>
      <circle cx="115" cy="40" r="4" class="dot"/>
      <path d="M20 145 L115 40 L210 145" class="thin"/>
      <path d="M50 145 L115 40 M80 145 L115 40 M150 145 L115 40 M180 145 L115 40" class="grid"/>
      <path d="M31 132 H199 M45 115 H185 M59 99 H171 M73 84 H157 M89 67 H141" class="grid"/>
      <text x="75" y="25" class="small">horizon</text>
    </g>
  </g>

  <!-- Panel 9: Kuba broken grid -->
  <g transform="translate(980,380)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Kuba broken grid</text>
    <text x="18" y="48" class="small">offset textile rhythm</text>
    <g transform="translate(52,68)">
      <rect x="0" y="0" width="40" height="40" class="fill"/>
      <rect x="40" y="0" width="40" height="40" class="accent"/>
      <rect x="80" y="0" width="40" height="40" class="fill"/>
      <rect x="120" y="0" width="40" height="40" class="accent"/>
      <rect x="20" y="40" width="40" height="40" class="accent"/>
      <rect x="60" y="40" width="40" height="40" class="fill"/>
      <rect x="100" y="40" width="40" height="40" class="accent"/>
      <rect x="140" y="40" width="40" height="40" class="fill"/>
      <rect x="0" y="80" width="40" height="40" class="accent"/>
      <rect x="40" y="80" width="40" height="40" class="fill"/>
      <rect x="95" y="80" width="40" height="40" class="accent"/>
      <rect x="135" y="80" width="40" height="40" class="fill"/>
      <path d="M0 0 L160 120 M40 0 L180 105 M0 60 L70 120" class="thin" opacity="0.45"/>
    </g>
  </g>

  <!-- Panel 10: Jali or lattice screen -->
  <g transform="translate(1290,380)">
    <rect class="panel" width="260" height="220" rx="12"/>
    <text x="18" y="28" class="text">Lattice screen</text>
    <text x="18" y="48" class="small">void geometry and shadow</text>
    <g transform="translate(45,68)">
      <rect x="0" y="0" width="170" height="120" class="thin"/>
      <path d="M0 0 L170 120 M42.5 0 L170 90 M85 0 L170 60 M127.5 0 L170 30 M0 30 L127.5 120 M0 60 L85 120 M0 90 L42.5 120" class="heavy"/>
      <path d="M170 0 L0 120 M127.5 0 L0 90 M85 0 L0 60 M42.5 0 L0 30 M170 30 L42.5 120 M170 60 L85 120 M170 90 L127.5 120" class="heavy" opacity="0.65"/>
    </g>
  </g>

  <!-- Panel 11: Roman mosaic tessellation -->
  <g transform="translate(50,640)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Roman mosaic unit</text>
    <text x="18" y="48" class="small">tessera repeat and border</text>
    <g transform="translate(54,70)">
      <rect x="0" y="0" width="160" height="120" class="thin"/>
      <g>
        <rect x="0" y="0" width="40" height="40" class="fill"/><rect x="40" y="0" width="40" height="40" class="accent"/><rect x="80" y="0" width="40" height="40" class="fill"/><rect x="120" y="0" width="40" height="40" class="accent"/>
        <rect x="0" y="40" width="40" height="40" class="accent"/><rect x="40" y="40" width="40" height="40" class="fill"/><rect x="80" y="40" width="40" height="40" class="accent"/><rect x="120" y="40" width="40" height="40" class="fill"/>
        <rect x="0" y="80" width="40" height="40" class="fill"/><rect x="40" y="80" width="40" height="40" class="accent"/><rect x="80" y="80" width="40" height="40" class="fill"/><rect x="120" y="80" width="40" height="40" class="accent"/>
      </g>
      <circle cx="80" cy="60" r="36" fill="none" stroke="#111" stroke-width="5"/>
    </g>
  </g>

  <!-- Panel 12: Ethiopian cross lattice -->
  <g transform="translate(360,640)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Ethiopian cross</text>
    <text x="18" y="48" class="small">interlace and negative space</text>
    <g transform="translate(140,120)">
      <path d="M-20 -80 H20 V-25 H75 V15 H20 V80 H-20 V15 H-75 V-25 H-20 Z" class="fill"/>
      <path d="M0 -70 L0 70 M-65 -5 L65 -5 M-48 -22 L48 22 M48 -22 L-48 22" class="heavy" opacity="0.55"/>
      <circle cx="0" cy="-45" r="10" fill="#fbfaf7" stroke="#111" stroke-width="2"/>
      <circle cx="0" cy="45" r="10" fill="#fbfaf7" stroke="#111" stroke-width="2"/>
      <circle cx="-45" cy="-5" r="10" fill="#fbfaf7" stroke="#111" stroke-width="2"/>
      <circle cx="45" cy="-5" r="10" fill="#fbfaf7" stroke="#111" stroke-width="2"/>
    </g>
  </g>

  <!-- Panel 13: South Asian mandala plan -->
  <g transform="translate(670,640)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Mandala plan</text>
    <text x="18" y="48" class="small">center, rings, quadrants</text>
    <g transform="translate(140,122)">
      <circle r="70" class="thin"/>
      <circle r="46" class="thin"/>
      <circle r="20" class="accent"/>
      <rect x="-50" y="-50" width="100" height="100" class="thin"/>
      <line x1="-80" y1="0" x2="80" y2="0" class="heavy"/>
      <line x1="0" y1="-80" x2="0" y2="80" class="heavy"/>
      <line x1="-56" y1="-56" x2="56" y2="56" class="grid"/>
      <line x1="-56" y1="56" x2="56" y2="-56" class="grid"/>
    </g>
  </g>

  <!-- Panel 14: Adinkra stamp grid placeholder -->
  <g transform="translate(980,640)">
    <rect class="panel" width="280" height="220" rx="12"/>
    <text x="18" y="28" class="text">Adinkra stamp grid</text>
    <text x="18" y="48" class="small">symbol cell and repeat field</text>
    <g transform="translate(54,70)">
      <rect x="0" y="0" width="160" height="120" class="thin"/>
      <path d="M40 0 V120 M80 0 V120 M120 0 V120 M0 40 H160 M0 80 H160" class="grid"/>
      <g transform="translate(20,20)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z M-12 0 H12 M0 -12 V12" class="heavy"/></g>
      <g transform="translate(60,60)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z M-12 0 H12 M0 -12 V12" class="heavy"/></g>
      <g transform="translate(100,20)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z M-12 0 H12 M0 -12 V12" class="heavy"/></g>
      <g transform="translate(140,100)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z M-12 0 H12 M0 -12 V12" class="heavy"/></g>
    </g>
  </g>

  <!-- Panel 15: Cross-cultural four directions -->
  <g transform="translate(1290,640)">
    <rect class="panel" width="260" height="220" rx="12"/>
    <text x="18" y="28" class="text">Four directions</text>
    <text x="18" y="48" class="small">center and world map</text>
    <g transform="translate(130,122)">
      <circle r="72" class="thin"/>
      <path d="M0 -72 L18 -18 L72 0 L18 18 L0 72 L-18 18 L-72 0 L-18 -18 Z" class="fill"/>
      <circle r="14" class="accent"/>
      <text x="-5" y="-84" class="small">N</text>
      <text x="-5" y="98" class="small">S</text>
      <text x="84" y="5" class="small">E</text>
      <text x="-96" y="5" class="small">W</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="1135" class="small">Rights note: This is an original instructional SVG seed sheet. It is not a copy of a museum object. Pair with sourced reference boards before presenting cultural examples.</text>
  <text x="50" y="1160" class="small">Suggested use: concept-card thumbnails, SVG construction demos, future Canvas overlays, and worksheet planning.</text>
</svg>
