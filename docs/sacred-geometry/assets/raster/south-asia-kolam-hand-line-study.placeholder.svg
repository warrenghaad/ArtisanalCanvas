  <rect width="600" height="240" fill="#f8f5ef"/>

  <!-- State 1: Dot grid only -->
  <rect x="5" y="5" width="185" height="185" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="97" y="202" text-anchor="middle" font-family="serif" font-size="10" fill="#888">1. dot grid (pullis)</text>
  <!-- 5×5 dot grid, spacing=32, start=(25,25) -->
  <g fill="#555">
    <circle cx="25" cy="25" r="3"/><circle cx="57" cy="25" r="3"/><circle cx="89" cy="25" r="3"/><circle cx="121" cy="25" r="3"/><circle cx="153" cy="25" r="3"/>
    <circle cx="25" cy="57" r="3"/><circle cx="57" cy="57" r="3"/><circle cx="89" cy="57" r="3"/><circle cx="121" cy="57" r="3"/><circle cx="153" cy="57" r="3"/>
    <circle cx="25" cy="89" r="3"/><circle cx="57" cy="89" r="3"/><circle cx="89" cy="89" r="3"/><circle cx="121" cy="89" r="3"/><circle cx="153" cy="89" r="3"/>
    <circle cx="25" cy="121" r="3"/><circle cx="57" cy="121" r="3"/><circle cx="89" cy="121" r="3"/><circle cx="121" cy="121" r="3"/><circle cx="153" cy="121" r="3"/>
    <circle cx="25" cy="153" r="3"/><circle cx="57" cy="153" r="3"/><circle cx="89" cy="153" r="3"/><circle cx="121" cy="153" r="3"/><circle cx="153" cy="153" r="3"/>
