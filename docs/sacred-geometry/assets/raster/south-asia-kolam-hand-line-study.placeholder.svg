  <text x="297" y="175" text-anchor="middle" font-family="serif" font-size="8" fill="#c0392b">artist continues here →</text>

  <!-- State 3: Completed kolam -->
  <rect x="405" y="5" width="185" height="185" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="497" y="202" text-anchor="middle" font-family="serif" font-size="10" fill="#888">3. completed loop</text>
