    <circle cx="425" cy="25" r="2.5"/><circle cx="457" cy="25" r="2.5"/><circle cx="489" cy="25" r="2.5"/><circle cx="521" cy="25" r="2.5"/><circle cx="553" cy="25" r="2.5"/>
