  <text x="297" y="202" text-anchor="middle" font-family="serif" font-size="10" fill="#888">2. loop in progress (~40%)</text>
  <!-- Dots faint -->
  <g fill="#bbb">
    <circle cx="225" cy="25" r="2.5"/><circle cx="257" cy="25" r="2.5"/><circle cx="289" cy="25" r="2.5"/><circle cx="321" cy="25" r="2.5"/><circle cx="353" cy="25" r="2.5"/>
