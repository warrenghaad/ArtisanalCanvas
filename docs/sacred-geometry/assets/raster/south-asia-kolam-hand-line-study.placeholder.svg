    <circle cx="225" cy="89" r="2.5"/><circle cx="257" cy="89" r="2.5"/><circle cx="289" cy="89" r="2.5"/><circle cx="321" cy="89" r="2.5"/><circle cx="353" cy="89" r="2.5"/>
