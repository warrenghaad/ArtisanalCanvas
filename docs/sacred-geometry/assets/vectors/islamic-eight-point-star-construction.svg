<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
  role="img" aria-label="Islamic eight-point star construction diagram showing two overlapping squares inscribed in a circle">
  <title>Islamic Eight-Point Star — Compass Construction</title>
  <desc>Construction of the classic Islamic eight-point star (rub el hizb / Star of Lakshmi) from two overlapping squares inscribed in a circle. Used as a flat-construction-vector asset for the ArtisanalCanvas sacred geometry curriculum.</desc>

  <!-- Background -->
  <rect width="400" height="400" fill="#faf7f2"/>

  <!-- Step 1: Construction circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#c8bfaf" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Step 2: Diameter axes -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#c8bfaf" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#c8bfaf" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Diagonal axes -->
  <line x1="94" y1="94" x2="306" y2="306" stroke="#c8bfaf" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="306" y1="94" x2="94" y2="306" stroke="#c8bfaf" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Step 3: Square A — the diamond (vertices at 0°,90°,180°,270°) -->
  <polygon points="350,200 200,50 50,200 200,350"
    fill="rgba(100,149,237,0.10)" stroke="#6495ed" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Step 4: Square B — the box (vertices at 45°,135°,225°,315°) -->
  <polygon points="306,94 94,94 94,306 306,306"
    fill="rgba(100,149,237,0.10)" stroke="#6495ed" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Step 5: Eight-point star — union of the two squares -->
  <polygon
    points="200,50 244,94 306,94 306,156 350,200 306,244 306,306 244,306 200,350 156,306 94,306 94,244 50,200 94,156 94,94 156,94"
    fill="rgba(184,134,11,0.75)" stroke="#8b6914" stroke-width="2"/>

  <!-- Center point -->
  <circle cx="200" cy="200" r="3" fill="#8b6914"/>

  <!-- Outer vertex dots -->
  <circle cx="200" cy="50"  r="3.5" fill="#4a3520"/>
  <circle cx="350" cy="200" r="3.5" fill="#4a3520"/>
  <circle cx="200" cy="350" r="3.5" fill="#4a3520"/>
  <circle cx="50"  cy="200" r="3.5" fill="#4a3520"/>
  <circle cx="306" cy="94"  r="3.5" fill="#4a3520"/>
  <circle cx="94"  cy="94"  r="3.5" fill="#4a3520"/>
  <circle cx="94"  cy="306" r="3.5" fill="#4a3520"/>
  <circle cx="306" cy="306" r="3.5" fill="#4a3520"/>

  <!-- Labels -->
  <text x="200" y="32" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">1</text>
  <text x="362" y="204" text-anchor="start"  font-family="serif" font-size="11" fill="#4a3520">2</text>
  <text x="200" y="372" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">3</text>
  <text x="28"  y="204" text-anchor="end"    font-family="serif" font-size="11" fill="#4a3520">4</text>
  <text x="312" y="88"  text-anchor="start"  font-family="serif" font-size="11" fill="#4a3520">5</text>
  <text x="82"  y="88"  text-anchor="end"    font-family="serif" font-size="11" fill="#4a3520">6</text>
  <text x="82"  y="316" text-anchor="end"    font-family="serif" font-size="11" fill="#4a3520">7</text>
  <text x="312" y="316" text-anchor="start"  font-family="serif" font-size="11" fill="#4a3520">8</text>

  <!-- Title bar -->
  <text x="200" y="392" text-anchor="middle" font-family="serif" font-size="10" fill="#7a6a54">
    Islamic Eight-Point Star · Two Overlapping Squares · Compass Construction
  </text>
</svg>
