<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
  role="img" aria-label="Persian chahar bagh fourfold garden plan: a cross-shaped layout dividing a walled enclosure into four quadrants with a central pool">
  <title>Persian Chahar Bagh — Fourfold Garden Plan</title>
  <desc>The chahar bagh (four-garden) is the foundational Persian garden layout: a walled rectangle divided into four quadrants by two perpendicular water channels meeting at a central pool or pavilion. The four-directional plan is a world-axis cosmogram expressed as landscape architecture. Flat-construction-vector asset.</desc>

  <rect width="400" height="400" fill="#f5f0e0"/>

  <!-- Outer wall -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8b7355" stroke-width="3"/>

  <!-- Four planted quadrants -->
  <rect x="24"  y="24"  width="166" height="166" fill="#c8d9b0" stroke="#8b7355" stroke-width="1"/>
  <rect x="210" y="24"  width="166" height="166" fill="#c8d9b0" stroke="#8b7355" stroke-width="1"/>
  <rect x="24"  y="210" width="166" height="166" fill="#c8d9b0" stroke="#8b7355" stroke-width="1"/>
  <rect x="210" y="210" width="166" height="166" fill="#c8d9b0" stroke="#8b7355" stroke-width="1"/>

  <!-- Diagonal construction lines (light) -->
  <line x1="24" y1="24"   x2="376" y2="376" stroke="#c0b090" stroke-width="0.8" stroke-dasharray="4 4"/>
  <line x1="376" y1="24"  x2="24"  y2="376" stroke="#c0b090" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- Horizontal water channel -->
  <rect x="20" y="190" width="360" height="20" fill="#7eb8d4" stroke="#4a90b8" stroke-width="1"/>
  <!-- Vertical water channel -->
  <rect x="190" y="20" width="20" height="360" fill="#7eb8d4" stroke="#4a90b8" stroke-width="1"/>

  <!-- Central pool / pavilion -->
  <circle cx="200" cy="200" r="22" fill="#4a90b8" stroke="#2c6080" stroke-width="2"/>
  <circle cx="200" cy="200" r="8"  fill="#faf7f2" stroke="#2c6080" stroke-width="1"/>

  <!-- Axis tick marks -->
  <line x1="200" y1="20"  x2="200" y2="35"  stroke="#4a90b8" stroke-width="2"/>
  <line x1="200" y1="365" x2="200" y2="380" stroke="#4a90b8" stroke-width="2"/>
  <line x1="20"  y1="200" x2="35"  y2="200" stroke="#4a90b8" stroke-width="2"/>
  <line x1="365" y1="200" x2="380" y2="200" stroke="#4a90b8" stroke-width="2"/>

  <!-- Direction labels -->
  <text x="200" y="16" text-anchor="middle" font-family="serif" font-size="10" fill="#2c6080">N</text>
  <text x="200" y="396" text-anchor="middle" font-family="serif" font-size="10" fill="#2c6080">S</text>
  <text x="8"  y="204" text-anchor="middle" font-family="serif" font-size="10" fill="#2c6080">W</text>
  <text x="393" y="204" text-anchor="middle" font-family="serif" font-size="10" fill="#2c6080">E</text>

  <!-- Entry gates on each axis -->
  <rect x="186" y="17" width="28" height="10" fill="#d4a857" stroke="#8b6914" stroke-width="1.5" rx="2"/>
  <rect x="186" y="373" width="28" height="10" fill="#d4a857" stroke="#8b6914" stroke-width="1.5" rx="2"/>
  <rect x="17"  y="186" width="10" height="28" fill="#d4a857" stroke="#8b6914" stroke-width="1.5" rx="2"/>
  <rect x="373" y="186" width="10" height="28" fill="#d4a857" stroke="#8b6914" stroke-width="1.5" rx="2"/>

  <!-- Sub-path lines within quadrants (secondary channels) -->
  <g stroke="#7eb8d4" stroke-width="0.8" stroke-dasharray="3 3">
    <!-- NW quadrant cross -->
    <line x1="107" y1="24"  x2="107" y2="190"/>
    <line x1="24"  y1="107" x2="190" y2="107"/>
    <!-- NE quadrant cross -->
    <line x1="293" y1="24"  x2="293" y2="190"/>
    <line x1="210" y1="107" x2="376" y2="107"/>
    <!-- SW quadrant cross -->
    <line x1="107" y1="210" x2="107" y2="376"/>
    <line x1="24"  y1="293" x2="190" y2="293"/>
    <!-- SE quadrant cross -->
    <line x1="293" y1="210" x2="293" y2="376"/>
    <line x1="210" y1="293" x2="376" y2="293"/>
  </g>

  <!-- Labels -->
  <text x="107" y="107" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="#4a6030">NW</text>
  <text x="293" y="107" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="#4a6030">NE</text>
  <text x="107" y="293" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="#4a6030">SW</text>
  <text x="293" y="293" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="#4a6030">SE</text>

  <!-- Dimension annotation: 4-fold axis -->
  <text x="200" y="229" text-anchor="middle" font-family="serif" font-size="9" fill="#2c6080">pool/hauz</text>

  <!-- Footer -->
  <text x="200" y="414" text-anchor="middle" font-family="serif" font-size="10" fill="#7a6a54">
    Persian Chahar Bagh · Four-Garden Plan · Water Channels + Central Pool
  </text>
</svg>
