<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
  role="img" aria-label="Mesoamerican stepped fret grid: 3-by-3 arrangement of xicalcoliuhqui stepped spiral units">
  <title>Mesoamerican Stepped Fret — Xicalcoliuhqui Grid</title>
  <desc>The xicalcoliuhqui (Nahuatl: stepped spiral) arranged as a 3×3 grid showing the repeat unit. Each unit is a right-angle stepped spiral that can be mirrored or rotated to form continuous border bands. Flat-construction-vector asset.</desc>

  <rect width="400" height="400" fill="#f7f2e8"/>

  <!-- Construction grid (light) -->
  <g stroke="#d8d0c0" stroke-width="0.4">
    <line x1="0"   y1="130" x2="400" y2="130"/>
    <line x1="0"   y1="260" x2="400" y2="260"/>
    <line x1="130" y1="0"   x2="130" y2="400"/>
    <line x1="260" y1="0"   x2="260" y2="400"/>
    <!-- Inner 10px sub-grid for one cell -->
    <line x1="10"  y1="0"   x2="10"  y2="130"/>
    <line x1="20"  y1="0"   x2="20"  y2="130"/>
    <line x1="30"  y1="0"   x2="30"  y2="130"/>
    <line x1="40"  y1="0"   x2="40"  y2="130"/>
    <line x1="50"  y1="0"   x2="50"  y2="130"/>
    <line x1="60"  y1="0"   x2="60"  y2="130"/>
    <line x1="70"  y1="0"   x2="70"  y2="130"/>
    <line x1="80"  y1="0"   x2="80"  y2="130"/>
    <line x1="90"  y1="0"   x2="90"  y2="130"/>
    <line x1="100" y1="0"   x2="100" y2="130"/>
    <line x1="110" y1="0"   x2="110" y2="130"/>
    <line x1="120" y1="0"   x2="120" y2="130"/>
    <line x1="0"   y1="10"  x2="130" y2="10"/>
    <line x1="0"   y1="20"  x2="130" y2="20"/>
    <line x1="0"   y1="30"  x2="130" y2="30"/>
    <line x1="0"   y1="40"  x2="130" y2="40"/>
    <line x1="0"   y1="50"  x2="130" y2="50"/>
    <line x1="0"   y1="60"  x2="130" y2="60"/>
    <line x1="0"   y1="70"  x2="130" y2="70"/>
    <line x1="0"   y1="80"  x2="130" y2="80"/>
    <line x1="0"   y1="90"  x2="130" y2="90"/>
    <line x1="0"   y1="100" x2="130" y2="100"/>
    <line x1="0"   y1="110" x2="130" y2="110"/>
    <line x1="0"   y1="120" x2="130" y2="120"/>
  </g>

  <!--
    Xicalcoliuhqui unit: a stepped right-angle spiral.
    Cell = 130×130. Step width = 10px.
    The spiral enters top-left and winds inward clockwise.
    Path as a thick polyline (stroke 8px, square cap):
    
    Outer spiral arm (top-to-right then down-then-left):
      Start at (0,10), go right to (120,10)
      Down to (120,120)
      Left to (10,120)
      Up to (10,20)
      Right to (110,20)
      Down to (110,110)
      Left to (20,110)
      Up to (20,30)
      Right to (100,30)
      Down to (100,100)
      Left to (30,100)
      Up to (30,40)
      Right to (90,40)
      Down to (90,90)
      Left to (40,90)
      Up to (40,50)
      Right to (80,50)
      Down to (80,80)
      Left to (50,80)
      Up to (50,60)
      Right to (70,60)
      Down to (70,70)
      Left to (60,70)  ← spiral center
  -->

  <!-- Define the stepped fret symbol -->
  <defs>
    <symbol id="fret" viewBox="0 0 130 130">
      <polyline
        points="0,10 120,10 120,120 10,120 10,20 110,20 110,110 20,110 20,30 100,30 100,100 30,100 30,40 90,40 90,90 40,90 40,50 80,50 80,80 50,80 50,60 70,60 70,70 60,70"
        fill="none" stroke="#3d2b1f" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <!-- Entry arrow at top-left -->
      <line x1="0" y1="10" x2="12" y2="10" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    </symbol>
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 3×3 grid of frets with alternating orientations -->
  <!-- Row 0, Col 0: normal -->
  <use href="#fret" x="0"   y="0"   width="130" height="130"/>
  <!-- Row 0, Col 1: mirrored horizontally -->
  <g transform="translate(260,0) scale(-1,1)">
    <use href="#fret" x="0" y="0" width="130" height="130"/>
  </g>
  <!-- Row 0, Col 2: normal -->
  <use href="#fret" x="260" y="0"   width="130" height="130"/>

  <!-- Row 1, Col 0: mirrored vertically -->
  <g transform="translate(0,260) scale(1,-1)">
    <use href="#fret" x="0" y="0" width="130" height="130"/>
  </g>
  <!-- Row 1, Col 1: rotated 180° (both mirrors) -->
  <g transform="translate(260,260) scale(-1,-1)">
    <use href="#fret" x="0" y="0" width="130" height="130"/>
  </g>
  <!-- Row 1, Col 2: mirrored vertically -->
  <g transform="translate(260,260) scale(1,-1)">
    <use href="#fret" x="0" y="0" width="130" height="130"/>
  </g>

  <!-- Row 2, Col 0: normal -->
  <use href="#fret" x="0"   y="260" width="130" height="130"/>
  <!-- Row 2, Col 1: mirrored horizontally -->
  <g transform="translate(260,260) scale(-1,1)">
    <use href="#fret" x="0" y="0" width="130" height="130"/>
  </g>
  <!-- Row 2, Col 2: normal -->
  <use href="#fret" x="260" y="260" width="130" height="130"/>

  <!-- Repeat unit indicator -->
  <rect x="1" y="1" width="128" height="128" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="4" y="11" font-family="serif" font-size="8" fill="#c0392b">unit</text>

  <!-- Footer -->
  <text x="200" y="394" text-anchor="middle" font-family="serif" font-size="10" fill="#7a6a54">
    Mesoamerican Stepped Fret · Xicalcoliuhqui · 3×3 Grid with Mirrored Orientations
  </text>
</svg>
